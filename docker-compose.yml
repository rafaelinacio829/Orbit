services:
  postgres:
    image: postgres:16-alpine
    container_name: orbit-desk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: orbit_desk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - orbit_desk_postgres_data:/var/lib/postgresql/data

volumes:
  orbit_desk_postgres_data:
